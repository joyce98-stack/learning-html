<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVIGATION</title>
    <style>
        font-family: "SF Pro Text", "SF Pro Icons", "Helvetica Neue", "Helvetica", "Arial", sans-serif;
        
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav{
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid rgb(75, 76, 78);
       }
    
         .nav-items{
         width: 100%;
         background-color: rgb(160, 104, 109);
         display: flex;
         justify-content: space-between;
         align-items:center;
        }

       .nav-items ul{
        display: flex;
        list-style: none;
        }
        
        .nav-items ul li{
            margin-right: 10px;
            margin-left: 10px;
        }
         
        .nav-items ul li a{
            text-decoration: none;
            color: rgb(190, 230, 139);
            text-transform:capitalize;
        }
    
        .nav-items ul li a:hover{
            color: rgb(80, 169, 228);
            text-decoration: underline;
        }

        .nav-items img{
            margin-left: 10px;

        }
        

    </style>
</head>

<body>
    <nav>
        

        <div class="nav-items">
            <img src="images/icons8-instagram-logo-94.png" alt="logo" width="100px" height="100px">
        
           <ul>
            <li> <a href="#">Home</a>  </li>
            <li> <a href="#">About</a>  </li>
            <li> <a href="#">Team</a>  </li>
            <li> <a href="#">Pricing</a>  </li> 
            <li> <a href="#">Contact</a>  </li>
           </ul>
           </div>

    </nav>

    <footer>

    </footer>
    
</body>

</html>
