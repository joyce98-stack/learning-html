<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>

    <style>
        body{
          font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        table{
           width: 50%;
           border: 1px solid rgb(75, 76, 78);
           margin:auto ;
           border-collapse: collapse;
        }
        
         th{
            color: brown;
            border: 2px solid pink;
            padding: 5px 10px;
            text-align: left;
            background-color: beige;
         }
 
         td{
            color: rgb(226, 115, 115);
            border: 2px solid pink;
            padding: 5px 10px;
            text-align: left;

         }

         .salary{
            color: crimson;
            font-weight:bold;
         }
            
    </style>

</head>
<body>
    <table>
        <thead>
            <tr> 
                 <th>First Name</th>
                 <th>Last Name</th>
                 <th>City</th>
                 <th>Age</th>
                 <th>Salary</th>
            </tr>
        </thead>
        

        <tbody>
            <tr>
            <td>Jnae </td>
            <td>Wangechi</td>
            <td>Nairobi</td>
            <td>22</td>
            <td class="salary">80,000</td>
            </tr>
            
             <tr>
            <td>Kiara </td>
            <td>Karol</td>
            <td>Nairobi</td>
            <td>20</td>
            <td class="salary">80,000</td>
            </tr>

             <tr>
            <td>Kaylee </td>
            <td>Joy</td>
            <td>Nairobi</td>
            <td>25</td>
            <td class="salary">80,000</td>
            </tr>

             <tr>
            <td>Kency </td>
            <td>Wambui</td>
            <td>Nairobi</td>
            <td>27</td>
            <td class="salary">80,000</td>
            </tr>
                    

        </tbody>

    </table>

<ol>
    <li>Nairobi</li>
    <li>Mombasa</li>
    <li>Kisumu</li>
    <li>Kiambu</li>
    <li>Nyeri</li>
</ol>

</body>
</html>
